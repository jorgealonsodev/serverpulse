[project]
name = "serverpulse"
version = "0.1.0"
description = "ServerPulse API — lightweight server monitoring"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg",
    "alembic",
    "pydantic-settings",
    "redis[hiredis]>=5",
    "slowapi",
    "passlib[bcrypt]",
    "python-jose[cryptography]",
    "python-multipart",
    "httpx",
    "prometheus-fastapi-instrumentator",
    "email-validator>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "httpx",
    "httpx-ws",
    "ruff",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]
ignore = [
    "B008",  # FastAPI Depends() in defaults is standard pattern
    "E402",  # Router imports after app creation (FastAPI pattern)
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
