# Development override — enables hot reload for backend and frontend
services:
  backend:
    build:
      dockerfile: Dockerfile.dev
    volumes:
      - ./backend/app:/app/app
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://serverpulse:serverpulse@postgres:5432/serverpulse
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: dev-secret-key-at-least-32-bytes-long!!
      JWT_ALGORITHM: HS256
      JWT_EXPIRE_MINUTES: 1440
      CORS_ORIGINS: http://localhost:5173
      AGENT_TOKEN_SALT: dev-agent-salt

  postgres:
    ports:
      - "5432:5432"

  redis:
    ports:
      - "6379:6379"
